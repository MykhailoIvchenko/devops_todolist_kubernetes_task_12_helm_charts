common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    tag: 4.0.1

  resources:
    requests:
      memory: '256Mi'
      cpu: '150m'
    limits:
      memory: '256Mi'
      cpu: '150m'

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

  pv:
    capacity: 1Gi

  pvc:
    resources:
      requests:
        storage: 1Gi

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        key: app
        values:
          - kube2py

  serviceAccount:
    name: secrets-reader

  secrets:
    - SECRET_KEY
    - DB_NAME
    - DB_USER
    - DB_PASSWORD
    - DB_HOST
