common:
  namespace: mysql

mysql:
  image:
    repository: mysql
    tag: '8.0'

  replicas: 2

  secrets:
    MYSQL_ROOT_PASSWORD: '1234'
    MYSQL_USER: 'app_user'
    MYSQL_PASSWORD: '1234'
    MYSQL_DATABASE: 'app_db'

  pvc:
    storage: 2Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  tolerations:
    - key: 'app'
      operator: 'Equal'
      value: 'mysql'
      effect: 'NoSchedule'

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: 'app'
                operator: In
                values:
                  - mysql
          topologyKey: 'kubernetes.io/hostname'
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: 'app'
                operator: In
                values:
                  - 'mysql'
